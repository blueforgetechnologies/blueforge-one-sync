name: Build Blueforge One Sync

# Builds the finished desktop sync app for Windows and macOS and publishes the
# installers to a GitHub Release (so the /download page can link them):
#   - Blueforge-One-Sync-Setup.exe  (one-click Windows installer, Inno Setup)
#   - Blueforge-One-Sync.dmg        (macOS disk image)
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows app + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Selftest the GUI stack on real Windows
        run: python bfsync_gui.py selftest

      - name: Build windowed tray app (onefile)
        run: >
          pyinstaller --onefile --windowed --name "Blueforge One Sync"
          --icon "bfsync/assets/blueforge.ico"
          --add-data "bfsync/assets;bfsync/assets"
          --collect-submodules pystray
          --collect-submodules watchdog
          --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageDraw
          --hidden-import tkinter
          bfsync_gui.py

      - name: Build command-line binary (onefile, for power users)
        run: >
          pyinstaller --onefile --name bfsync
          --icon "bfsync/assets/blueforge.ico"
          --add-data "bfsync/assets;bfsync/assets"
          --collect-submodules watchdog
          bfsync_main.py

      - name: Smoke test the frozen binaries
        shell: pwsh
        run: |
          & ".\dist\bfsync.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke failed" }
          & ".\dist\Blueforge One Sync.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke failed" }

      - name: Write Inno Setup script
        shell: pwsh
        run: |
          $iss = @'
          #define MyApp "Blueforge One Sync"
          #define MyExe "Blueforge One Sync.exe"

          [Setup]
          AppId={{4E7A1B9C-8D2F-4C5E-A3B7-0FB1UEF0RGE1}}
          AppName={#MyApp}
          AppVersion=1.0.0
          AppPublisher=Blueforge Technologies
          DefaultDirName={autopf}\Blueforge One Sync
          DefaultGroupName=Blueforge One Sync
          DisableProgramGroupPage=yes
          UninstallDisplayIcon={app}\{#MyExe}
          OutputDir=installer
          OutputBaseFilename=Blueforge-One-Sync-Setup
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest
          WizardStyle=modern

          [Files]
          Source: "dist\Blueforge One Sync.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "dist\bfsync.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Blueforge One Sync"; Filename: "{app}\{#MyExe}"
          Name: "{userdesktop}\Blueforge One Sync"; Filename: "{app}\{#MyExe}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Shortcuts:"

          [Run]
          Filename: "{app}\{#MyExe}"; Description: "Start Blueforge One Sync now"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path "installer.iss" -Value $iss -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publish installer to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: installer/Blueforge-One-Sync-Setup.exe
          draft: false

  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS app + dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Selftest the GUI stack on real macOS
        run: python bfsync_gui.py selftest

      - name: Build windowed .app bundle
        run: >
          pyinstaller --windowed --name "Blueforge One Sync"
          --add-data "bfsync/assets:bfsync/assets"
          --collect-submodules pystray
          --collect-submodules watchdog
          --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageDraw
          bfsync_gui.py

      - name: Build command-line binary (for power users)
        run: >
          pyinstaller --onefile --name bfsync
          --add-data "bfsync/assets:bfsync/assets"
          --collect-submodules watchdog
          bfsync_main.py

      - name: Smoke test the CLI binary
        run: ./dist/bfsync --version

      - name: Package .app into a .dmg
        run: |
          mkdir -p dmgroot
          cp -R "dist/Blueforge One Sync.app" dmgroot/
          ln -s /Applications "dmgroot/Applications"
          hdiutil create -volname "Blueforge One Sync" \
            -srcfolder dmgroot -ov -format UDZO \
            "Blueforge-One-Sync.dmg"

      - name: Publish dmg to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: Blueforge-One-Sync.dmg
          draft: false
